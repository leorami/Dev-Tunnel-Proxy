<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CTO observer consent</title>
  <link rel="stylesheet" href="/status/common.css" />
</head>
<body>
  <main style="max-width:42rem;margin:2rem auto;padding:0 1rem;font-family:ui-sans-serif,system-ui,sans-serif;">
    <h1>CTO visual observer consent</h1>
    <p>Issue a ten-minute, revocable, read-only observation grant. The redemption secret stays in this owner browser response only — never paste it into chat, GitHub, or logs.</p>
    <label>Observer principal<br /><input id="principal" style="width:100%" placeholder="chatgpt-work-cto-observer" /></label>
    <label style="display:block;margin-top:0.75rem;">Source SHA (40 hex)<br /><input id="sourceSha" style="width:100%" /></label>
    <label style="display:block;margin-top:0.75rem;">CSRF token<br /><input id="csrf" style="width:100%" /></label>
    <div style="margin-top:1rem;display:flex;gap:0.75rem;flex-wrap:wrap;">
      <button id="issue" type="button">Issue grant</button>
      <button id="revoke" type="button">Revoke grant</button>
    </div>
    <pre id="out" style="margin-top:1rem;white-space:pre-wrap;background:#111;color:#eee;padding:1rem;border-radius:8px;min-height:6rem;"></pre>
  </main>
  <script>
    const out = document.getElementById('out');
    function show(x){ out.textContent = typeof x === 'string' ? x : JSON.stringify(x, null, 2); }
    async function post(path, body){
      const csrf = document.getElementById('csrf').value.trim();
      const res = await fetch(path, {
        method: 'POST',
        credentials: 'same-origin',
        headers: {
          'content-type': 'application/json',
          'x-devproxy-csrf': csrf,
        },
        body: JSON.stringify({ ...body, csrfToken: csrf }),
      });
      const json = await res.json().catch(() => ({}));
      return { status: res.status, json };
    }
    document.getElementById('issue').onclick = async () => {
      const r = await post('/admin/cto-observer/grants', {
        observerPrincipal: document.getElementById('principal').value.trim(),
        sourceSha: document.getElementById('sourceSha').value.trim(),
      });
      show(r);
    };
    document.getElementById('revoke').onclick = async () => {
      const grantId = prompt('grantId to revoke');
      if (!grantId) return;
      const r = await post('/admin/cto-observer/revoke', { grantId });
      show(r);
    };
  </script>
</body>
</html>
