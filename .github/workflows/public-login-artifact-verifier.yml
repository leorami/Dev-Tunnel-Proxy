name: Dev Proxy original public-login pixel artifact integrity
on:
  pull_request:
    paths:
      - 'scripts/visuals/verify_public_login_artifact.py'
      - 'tests/visuals/test_verified_public_login_artifact.py'
      - '.github/workflows/public-login-artifact-verifier.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-png:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify public-only manifest, PNG integrity and tamper refusal
        run: python3 -m unittest -v tests/visuals/test_verified_public_login_artifact.py
