name: V192 isolated two-process Signal Protocol proof
on:
  pull_request:
    paths:
      - 'tests/security/v192-libsignal-two-peers.test.mjs'
      - 'tests/security/fixtures/v192-libsignal-peer.mjs'
      - '.github/workflows/devproxy-v192-libsignal-two-peers.yml'
      - 'docs/architecture/DEVPROXY_V192_LIBSIGNAL_OFFLINE_PROOF.md'
      - 'docs/handoffs/DEVPROXY_V192_SIGNAL_TWO_PEERS.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-signal-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Install pinned official libsignal test dependency in runner temp only
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/devproxy-v192"
          npm install --prefix "$RUNNER_TEMP/devproxy-v192" --no-save --no-package-lock --no-audit --no-fund --ignore-scripts @signalapp/libsignal-client@0.106.0
          node -p "require(process.env.RUNNER_TEMP + '/devproxy-v192/node_modules/@signalapp/libsignal-client/package.json').version"
      - name: Two separate endpoint processes and real PQXDH/ratchet security checks
        env:
          V192_LIBSIGNAL_PACKAGE_ROOT: ${{ runner.temp }}/devproxy-v192/node_modules/@signalapp/libsignal-client
        run: |
          node --check tests/security/v192-libsignal-two-peers.test.mjs
          node --check tests/security/fixtures/v192-libsignal-peer.mjs
          node --test tests/security/v192-libsignal-two-peers.test.mjs
