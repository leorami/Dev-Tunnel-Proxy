name: Dev Proxy supported Node LTS source gate
on:
  pull_request:
    paths:
      - 'docker-compose*.yml'
      - 'smart-build.sh'
      - 'utils/calliopeHealing.js'
      - 'utils/proxyConfigAPI.js'
      - 'utils/recovery-image-binding.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'tests/security/v203-supported-node-runtime.test.cjs'
      - 'status/status.html'
      - 'status/health.html'
      - 'status/reports.html'
      - 'status/common.js'
      - 'status/common.css'
      - 'tests/security/v210-status-report-trust.test.cjs'
      - 'tests/security/v214-shared-shell.test.cjs'
      - 'tests/visuals/test_v214_shared_shell_browser.py'
      - 'tests/visuals/status_browser_harness.py'
      - 'macos/dev-tunnel-proxy-notifications'
      - 'tests/security/v209-notification-pinned-runtime.test.cjs'
      - 'utils/rc2-worker-release-closure.cjs'
      - 'tests/security/rc2-worker-release-closure.test.cjs'
      - '.github/workflows/devproxy-v203-supported-node.yml'
      - 'docs/handoffs/DEVPROXY_V203_SUPPORTED_NODE_RUNTIME.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x','24.x']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - name: Source identity and actual Node version
        run: |
          git log -1 --format=%H
          node --version
      - name: Runtime source and historical archive contracts
        run: node --test tests/security/v203-supported-node-runtime.test.cjs tests/security/recovery-image-tag-binding.test.mjs
      - name: Worker closure stability and fail-closed regressions
        run: node --test tests/security/rc2-worker-release-closure.test.cjs
      - name: Pinned notification launcher with synthetic engine only
        run: node --test tests/security/v209-notification-pinned-runtime.test.cjs
      - name: Historical status report evidence and safe presentation
        run: node --test tests/security/v210-status-report-trust.test.cjs tests/security/v214-shared-shell.test.cjs tests/security/v160-status-calliope-experience.test.cjs tests/security/notification-bridge-status-thirdparty-script-trust.test.cjs tests/security/calliope-status-chat-singleflight.test.cjs
      - name: Check affected executable syntax without launching any service
        run: |
          bash -n smart-build.sh
          bash -n macos/dev-tunnel-proxy-notifications
          node --check utils/calliopeHealing.js
          node --check utils/proxyConfigAPI.js
