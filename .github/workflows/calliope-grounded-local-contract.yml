name: Calliope grounded local conversation trust contract
on:
  pull_request:
    paths:
      - 'utils/calliope-grounded-local-turn.cjs'
      - 'tests/calliope/v181-grounded-local-turn.test.cjs'
      - '.github/workflows/calliope-grounded-local-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-turn-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: RED first then pure read-only persona and evidence trust gate
        run: node --test tests/calliope/v181-grounded-local-turn.test.cjs
