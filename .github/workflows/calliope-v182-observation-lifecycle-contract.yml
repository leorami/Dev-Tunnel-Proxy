name: V182 Calliope source-owned evidence lifetime (GREEN core + expected RED integration)
on:
  pull_request:
    paths:
      - 'utils/calliope-trusted-observation-cache.cjs'
      - 'tests/calliope/v182-trusted-observation-cache.test.cjs'
      - 'tests/calliope/v182-runtime-evidence-freshness-red.test.cjs'
      - '.github/workflows/calliope-v182-observation-lifecycle-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-cache-green-and-integration-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: CTO pure observation cache contract MUST be GREEN
        run: node --test tests/calliope/v182-trusted-observation-cache.test.cjs
      - name: CTO original V181 integration MUST demonstrate RED before Engineer implementation
        shell: bash
        run: |
          if node --test tests/calliope/v182-runtime-evidence-freshness-red.test.cjs; then
            echo 'UNEXPECTED GREEN: V181 integration already satisfies the frozen V182 regression; investigate before implementation.'
            exit 1
          fi
          echo 'EXPECTED RED: the immutable V181 runtime still reuses stale/invalid HEAD evidence; Engineer must integrate the bounded cache.'
