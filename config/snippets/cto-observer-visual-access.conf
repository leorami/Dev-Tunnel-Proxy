# SOURCE CANDIDATE ONLY — V174 CTO visual observer bridge.
# Do NOT include in live nginx until a separate owner runtime GO.
# Dual gate: auth_request /admin/visual-access-check (admin XOR observer).
# Observer session cookie: cto_observer_session (never admin_session reuse).

location = /admin/cto-observer/grants {
  proxy_pass http://config_api_upstream/admin/cto-observer/grants;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Origin $http_origin;
  proxy_set_header Cookie $http_cookie;
  proxy_set_header X-DevProxy-CSRF $http_x_devproxy_csrf;
}

location = /admin/cto-observer/redeem {
  proxy_pass http://config_api_upstream/admin/cto-observer/redeem;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Origin $http_origin;
  proxy_set_header Cookie $http_cookie;
  proxy_set_header X-DevProxy-CSRF $http_x_devproxy_csrf;
}

location = /admin/cto-observer/revoke {
  proxy_pass http://config_api_upstream/admin/cto-observer/revoke;
  proxy_set_header Host $host;
  proxy_set_header Origin $http_origin;
  proxy_set_header Cookie $http_cookie;
  proxy_set_header X-DevProxy-CSRF $http_x_devproxy_csrf;
}

location = /admin/cto-observer/check {
  internal;
  proxy_pass http://config_api_upstream/admin/cto-observer/check;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header X-Original-URI $request_uri;
  proxy_set_header Cookie $http_cookie;
}

location = /admin/visual-access-check {
  internal;
  proxy_pass http://config_api_upstream/admin/visual-access-check;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header X-Original-URI $request_uri;
  proxy_set_header Cookie $http_cookie;
  proxy_set_header Authorization $http_authorization;
}
